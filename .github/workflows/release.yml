name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          add-rust-environment-hash-key: false

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Largy Launcher ${{ github.ref_name }}"
          releaseBody: "Installe `LargyLauncher-Setup.exe` et lance-le — aucune configuration requise."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # Same installer under a version-free name, so the README can link to
      # releases/latest/download/LargyLauncher-Setup.exe and always get the newest one.
      - name: Upload stable-named installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName LargyLauncher-Setup.exe
          gh release upload "${{ github.ref_name }}" LargyLauncher-Setup.exe --clobber
