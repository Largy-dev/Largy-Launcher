name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A tag that doesn't match the app's own version would publish an
      # installer (and an updater manifest) announcing the wrong version.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag) {
            Write-Error "Tag v$tag but package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          add-rust-environment-hash-key: false

      - run: npm ci

      # Authenticode signing through Azure Trusted Signing — Windows then
      # stops showing "Windows protected your PC". Switched on as soon as the
      # AZURE_* secrets and TRUSTED_SIGNING_* variables exist; without them the
      # build is unsigned, as before.
      - name: Configure code signing
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:ENDPOINT -or -not $env:ACCOUNT -or -not $env:PROFILE) {
            Write-Host "Code signing not configured: building unsigned."
            "args=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          cargo install trusted-signing-cli --locked
          $command = "trusted-signing-cli -e $env:ENDPOINT -a $env:ACCOUNT -c $env:PROFILE -d `"Largy Launcher`" %1"
          @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8 src-tauri/tauri.signing.json
          "args=--config src-tauri/tauri.signing.json" >> $env:GITHUB_OUTPUT

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Baked into the binary (option_env!) so the CurseForge tab works
          # with no setup; never committed to the repo.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          args: ${{ steps.signing.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Largy Launcher ${{ github.ref_name }}"
          releaseBody: "Installe `LargyLauncher-Setup.exe` et lance-le — aucune configuration requise."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # Same installer under a version-free name, so the README can link to
      # releases/latest/download/LargyLauncher-Setup.exe and always get the newest one.
      - name: Upload stable-named installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName LargyLauncher-Setup.exe
          gh release upload "${{ github.ref_name }}" LargyLauncher-Setup.exe --clobber
